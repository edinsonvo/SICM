[build-system]

requires = ["setuptools>=69"]

build-backend = "setuptools.build_meta"


[project]

name = "sicm"

version = "5.1.0rc1"

description = "Sistema Interactivo de Simulación Macroeconómica"

authors = [

    {name="Patrocinio Valencia"}

]

requires-python=">=3.11"

dependencies = [

    "streamlit",

    "plotly",

    "numpy",

    "pandas",

    "scipy",

    "statsmodels"

]
