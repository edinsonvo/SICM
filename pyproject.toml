[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sicm-core"
version = "1.0.0a1"
description = "Scientific Interactive Macroeconomic Simulation Core"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name="Patrocinio Valencia", email="edvalenciao@unal.edu.co"}]
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "mkdocs>=1.6", "mkdocs-material>=9.5", "pre-commit>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
